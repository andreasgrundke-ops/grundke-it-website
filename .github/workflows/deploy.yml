name: Deploy auf den Server (Branch live)

# Ablauf (seit 08.11.2026, Umzug auf eigenen Server):
#   1. build:  check_static --ci, interne Dateien entfernen, Artefakt hochladen. Schlaegt eine Pruefung
#              fehl, endet hier alles: Branch `live` aendert sich nicht.
#   2. live:   dasselbe bereinigte Artefakt als Einzel-Commit ohne Historie per Force-Push in Branch `live`;
#              der Server holt ihn von dort. Nur dieser Job darf schreiben (contents: write).
# GitHub Pages ist seit 08.11.2026 abgeschaltet (Hosting nur noch auf dem Hetzner-VPS).
# Actions sind per Commit-SHA gepinnt, der Tag steht als Kommentar daneben.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-live"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Statische Pruefungen vor dem Ausliefern (Spec §9). --ci laesst AK13v und AK14r aus: die brauchen
      # ../_intern/ bzw. Git-Historie, beides gibt es hier nicht. Schlaegt eine Pruefung fehl, endet der
      # Lauf hier und nichts wird hochgeladen.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Statische Pruefungen (check_static --ci)
        run: python -B tools/checks/check_static.py --ci

      # Nicht ausliefern: Generator und Pruefskripte, Arbeitsdaten, docs/ (PUNKTE.md war live), Markdown im Wurzelordner und
      # Dotfiles (.gitignore nannte interne Dateinamen und war live abrufbar; .github schliesst
      # upload-pages-artifact zwar selbst aus, hier trotzdem ausdruecklich).
      - name: Interne Dateien aus dem Artefakt entfernen
        run: |
          rm -rf tools docs .impeccable "Audit 2026-04" .github
          rm -f .gitignore
          find . -maxdepth 1 -name "*.md" -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'

  live:
    # Haengt an build, also an check_static: nur gepruefte Staende kommen auf den Server.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Bereinigtes Artefakt holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # Einzel-Commit ohne Historie (orphan), Autor github-actions. Das Token steht nur im Header dieses einen
      # git-Aufrufs, nicht in der Remote-URL und nicht in .git/config.
      - name: Branch live schreiben (Force-Push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$site"
          test -f "$site/index.html" && test -f "$site/sw.js" && test -f "$site/404.html"
          if find "$site" -type l | grep -q .; then echo "Symlink im Artefakt, Abbruch"; exit 1; fi
          cd "$site"
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "live: ${GITHUB_SHA} (Lauf ${GITHUB_RUN_ID})"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/live
          echo "live = $(git rev-parse HEAD) aus main ${GITHUB_SHA}"
